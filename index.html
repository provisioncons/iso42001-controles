<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo de controles — ISO/IEC 42001</title><style>body{font:16px system-ui,Arial;color:#171717;background:#fafafa;margin:0}main{max-width:1000px;margin:32px auto;padding:24px;background:white;border:1px solid #ddd;border-radius:16px}h1{font-size:1.65rem}button{border:1px solid #ccc;background:white;border-radius:24px;padding:10px 17px;margin:4px;cursor:pointer;font-size:1rem}button.active{background:#111;color:white}table{border-collapse:collapse;width:100%;margin-top:20px}th,td{text-align:left;padding:16px;border-bottom:1px solid #e5e5e5;vertical-align:top}th:first-child{width:25%}td span{display:block;color:#555;font-size:.92rem;margin-top:4px}small{color:#666}footer{margin-top:28px;color:#666;font-size:.85rem}@media(max-width:600px){main{margin:8px;padding:14px}th,td{padding:12px 7px}}</style></head><body><main><h1>Catálogo de controles — ISO/IEC 42001:2023</h1><p>Selecione um grupo para consultar seus controles.</p><nav id="tabs"></nav><h2 id="heading"></h2><p id="count"></p><table><thead><tr><th>Controle</th><th>Descrição e aplicação</th></tr></thead><tbody id="rows"></tbody></table><footer>Material didático: síntese interpretativa em português, não substitui o texto oficial da ISO/IEC 42001:2023.</footer></main><script>const groups=[["A.2","Políticas relacionadas à IA",[["A.2.2","Política de IA","Documentar diretrizes para desenvolver ou utilizar IA."],["A.2.3","Alinhamento com outras políticas","Integrar a política de IA às políticas institucionais."],["A.2.4","Revisão da política","Revisar periodicamente a política."]]],["A.3","Organização interna",[["A.3.2","Papéis e responsabilidades","Definir responsáveis pelas atividades e decisões relacionadas à IA."],["A.3.3","Comunicação de preocupações","Criar canais para comunicar preocupações sobre IA."]]],["A.4","Recursos para sistemas de IA",[["A.4.2","Documentação de recursos","Documentar os recursos necessários."],["A.4.3","Recursos de dados","Identificar os dados utilizados."],["A.4.4","Ferramentas","Documentar ferramentas empregadas."],["A.4.5","Infraestrutura computacional","Documentar recursos de processamento."],["A.4.6","Recursos humanos","Identificar pessoas e competências necessárias."]]],["A.5","Avaliação dos impactos",[["A.5.2","Processo de avaliação de impactos","Estabelecer método de avaliação."],["A.5.3","Documentação das avaliações","Registrar os resultados."],["A.5.4","Impactos sobre indivíduos e grupos","Avaliar consequências sobre pessoas e grupos."],["A.5.5","Impactos sociais","Avaliar impactos mais amplos na sociedade."]]],["A.6","Ciclo de vida dos sistemas de IA",[["A.6.1.2","Objetivos de desenvolvimento responsável","Definir objetivos de desenvolvimento responsável."],["A.6.1.3","Processos de desenvolvimento responsável","Estabelecer processos de desenvolvimento."],["A.6.2.2","Requisitos e especificações","Definir requisitos do sistema."],["A.6.2.3","Documentação de projeto e desenvolvimento","Registrar decisões de desenvolvimento."],["A.6.2.4","Verificação e validação","Verificar requisitos e validar resultados."],["A.6.2.5","Implantação","Controlar a entrada em operação."],["A.6.2.6","Operação e monitoramento","Monitorar o funcionamento."],["A.6.2.7","Documentação técnica","Manter documentação técnica."],["A.6.2.8","Registros de eventos","Registrar eventos para rastreabilidade."]]],["A.7","Dados para sistemas de IA",[["A.7.2","Dados para desenvolvimento e melhoria","Gerenciar dados de desenvolvimento e aprimoramento."],["A.7.3","Aquisição de dados","Controlar a obtenção dos dados."],["A.7.4","Qualidade dos dados","Definir requisitos de qualidade."],["A.7.5","Proveniência dos dados","Registrar origem e histórico dos dados."],["A.7.6","Preparação dos dados","Controlar o tratamento dos dados."]]],["A.8","Informações para partes interessadas",[["A.8.2","Documentação e informação aos usuários","Fornecer orientações aos usuários."],["A.8.3","Comunicação externa","Definir mecanismos de comunicação externa."],["A.8.4","Comunicação de incidentes","Definir comunicação de incidentes."],["A.8.5","Informações às partes interessadas","Disponibilizar informações apropriadas."]]],["A.9","Uso dos sistemas de IA",[["A.9.2","Processos de uso responsável","Estabelecer processos de uso responsável."],["A.9.3","Objetivos de uso responsável","Definir objetivos para o uso dos sistemas."],["A.9.4","Uso pretendido","Assegurar utilização conforme a finalidade prevista."]]],["A.10","Relacionamentos com terceiros e clientes",[["A.10.2","Distribuição de responsabilidades","Definir responsabilidades entre as partes."],["A.10.3","Fornecedores","Gerenciar riscos de fornecedores."],["A.10.4","Clientes","Definir e comunicar responsabilidades com clientes."]]]];const tabs=document.getElementById('tabs'),rows=document.getElementById('rows');function show(i){tabs.replaceChildren();groups.forEach((g,j)=>{let b=document.createElement('button');b.textContent=g[0];b.className=j===i?'active':'';b.onclick=()=>show(j);tabs.append(b)});let g=groups[i];document.getElementById('heading').textContent=g[0]+' — '+g[1];document.getElementById('count').textContent=g[2].length+' controles';rows.replaceChildren();g[2].forEach(c=>{let tr=document.createElement('tr'),id=document.createElement('td'),desc=document.createElement('td'),strong=document.createElement('strong'),span=document.createElement('span');id.textContent=c[0];strong.textContent=c[1];span.textContent=c[2];desc.append(strong,span);tr.append(id,desc);rows.append(tr)})}show(0);</script></body></html>
